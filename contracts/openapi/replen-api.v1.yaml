        occurredAt: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        correlationId: { type: [string, "null"] }
        before: {}
        after: {}
        metadata: {}
        prevHash: { type: [string, "null"] }
        hash: { type: string }
    AuditVerification:
      type: object
      required: [valid, checked]
      properties:
        valid: { type: boolean }
        checked: { type: integer }
        firstInvalidSeq: { type: [integer, "null"] }
    OutboxEvent:
      type: object
      required: [seq, event, publishedAt, attempts]
      properties:
