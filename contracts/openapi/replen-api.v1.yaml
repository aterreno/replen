          properties:
            id: { type: string }
            type: { type: string }
            subject: { type: string }
            time: { type: string }
            aggregateversion: { type: integer }
            correlationid: { type: string }
          description: "CloudEvents envelope (contracts/events/envelope.schema.json)"
        publishedAt: { type: [string, "null"], format: date-time }
        attempts: { type: integer }
        lastError: { type: [string, "null"] }
        deadLetteredAt: { type: [string, "null"], format: date-time }
    KpiValue:
      type: object
      required: [key, label, value, unit, definition, source]
      properties:
        key: { type: string }
