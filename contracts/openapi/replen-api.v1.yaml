        poNumber: { type: string }
        sourceProposalId: { type: string, format: uuid }
        supplierId: { type: string }
        destinationLocationId: { type: string }
        orderDate: { type: string, format: date }
        expectedDeliveryDate: { type: string, format: date }
        status: { type: string, enum: [CREATED, SUBMITTED, SUBMISSION_FAILED, CONFIRMED, PARTIALLY_RECEIVED, RECEIVED, CANCELLED] }
        erpPoNumber: { type: [string, "null"] }
        submissionAttempts: { type: integer }
        lastError: { type: [string, "null"] }
        totalValue: { type: number }
        currency: { type: string }
        approvedBy: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: "#/components/schemas/PurchaseOrderLine" } }
    AuditEvent:
      type: object
