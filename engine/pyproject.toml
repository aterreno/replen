[project]
name = "replen-engine"
version = "0.1.0"
description = "Forecasting and inventory optimisation engine for Replen"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.3",
  "duckdb>=1.4",
  "ortools>=9.14",
  "pydantic>=2.11",
  "fastapi>=0.120",
  "uvicorn>=0.38",
]

[project.scripts]
replen-engine = "replen_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replen_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/replen_engine/synthetic.py" = ["E501"]
